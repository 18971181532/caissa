name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the test suite
        run: python run_tests.py

      - name: Smoke-test the CLI
        run: |
          python run.py --version
          python run.py perft --depth 2
          python run.py search --depth 3

      - name: Smoke-test the PGN reader
        run: python run.py pgn --in examples/opera-game.pgn
